<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Simulation - Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #b1d9e8 0%, #719cf9 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }
        .header h1 {
            font-size: 48px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        .card {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .card h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 24px;
        }
        .status-message {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .status-loading {
            background-color: #fff3cd;
            color: #856404;
        }
        .status-success {
            background-color: #d4edda;
            color: #155724;
        }
        .status-error {
            background-color: #f8d7da;
            color: #721c24;
        }
        button {
            background-color: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            width: 100%;
            font-weight: bold;
        }
        button:hover {
            background-color: #764ba2;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        .output {
            background-color: #1e1e1e;
            color: #00ff00;
            padding: 15px;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.5;
            max-height: 600px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            margin-top: 15px;
        }
        .output::-webkit-scrollbar {
            width: 8px;
        }
        .output::-webkit-scrollbar-track {
            background: #333;
            border-radius: 5px;
        }
        .output::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 5px;
        }
        .chart-container {
            position: relative;
            height: 400px;
            margin-top: 15px;
        }
        .legend {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }
        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 3px;
        }

        /* Strategy visualization styles */
        .strategy-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 0;
        }
        .strategy-label {
            width: 120px;
            flex: 0 0 120px;
            font-size: 14px;
            color: #333;
            text-align: left;
            padding-right: 8px;
        }
        /* hide detailed meta text (we remove it from JS) */
        .strategy-meta {
            display: none;
        }
        .strategy-bar-wrapper {
            position: relative;
            flex: 1 1 auto;
            width: auto;
            height: 28px;
            background: #f3f3f3;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #ddd;
        }
        .pit-window .pit-label {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 12px;
            font-weight: 700;
            color: #000;
            white-space: nowrap;
            pointer-events: none;
            text-shadow: 0 1px 0 rgba(255,255,255,0.8);
        }
        .pit-window .pit-label.left { left: 6px; }
        .pit-window .pit-label.right { right: 6px; }
        .stint-segment {
            display: inline-block;
            height: 100%;
            position: relative;
            z-index: 1;
        }
        .pit-window {
            position: absolute;
            top: 0;
            height: 100%;
            background: rgba(144,238,144,1);
            pointer-events: none;
            border-left: 2px dashed rgba(0,100,0,0.3);
            border-right: 2px dashed rgba(0,100,0,0.3);
            box-shadow: 0 0 8px rgba(144,238,144,0.35);
            z-index: 10;
        }
        .lap-ticks {
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            margin-top: 6px;
            pointer-events: none;
            z-index: 4;
        }
        .lap-tick {
            position: absolute;
            top: 0;
            transform: translateX(-50%);
            font-size: 12px;
            color: #000;
            font-weight: 700;
            user-select: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>F1 Simulation Dashboard</h1>
            <p>Powered by C# Backend with Python Integration</p>
        </div>

        <div class="cards">
            <!-- API Status Card -->
            <div class="card">
                <h2>API Status</h2>
                <div class="status-message status-loading" id="apiStatus">
                    Checking connection...
                </div>
            </div>

            <!-- C# Runner Card -->
            <div class="card">
                <h2>C# Application</h2>
                <button id="runButton" onclick="runCSharp()">Run C# Script</button>
                <div class="status-message" id="csharpStatus" style="display: none;"></div>
                <div class="output" id="output" style="display: none;"></div>
            </div>

            <!-- Tyre Curves Card -->
            <div class="card" style="grid-column: 1 / -1;">
                <h2>Tyre Degradation Curves</h2>
                <div style="margin-bottom: 15px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                    <div>
                        <label for="countrySelect" style="margin-right: 5px;">Country:</label>
                        <select id="countrySelect" style="padding: 8px; border-radius: 5px; border: 1px solid #ccc;">
                            <option value="Spain">Spain</option>
                            <option value="Hungary">Hungary</option>
                            <option value="Japan">Japan</option>
                        </select>
                    </div>
                    <div>
                        <label for="yearSelect" style="margin-right: 5px;">Year:</label>
                        <select id="yearSelect" style="padding: 8px; border-radius: 5px; border: 1px solid #ccc;">
                            <option value="2024">2024</option>
                            <option value="2025">2025</option>
                        </select>
                    </div>
                    <button id="loadCurvesBtn" onclick="loadTyreCurves()" style="padding: 12px 20px; width: auto; margin-left: auto;">Load Curves</button>
                </div>
                <div class="status-message" id="curveStatus" style="display: none;"></div>
                <div class="chart-container">
                    <canvas id="tyreCurvesChart"></canvas>
                </div>
                <div class="legend">
                    <div class="legend-item">
                        <div class="legend-color" style="background-color: #FF0000;"></div>
                        <span>Soft</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background-color: #FFFF00;"></div>
                        <span>Medium</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background-color: #50444457; border: 1px solid #242126;"></div>
                        <span>Hard</span>
                    </div>
                </div>
            </div>
            <div class="card" style="grid-column: 1 / -1;">
                <h2>Top Strategies</h2>
                <div style="margin-bottom: 15px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                    <button id="loadStratsBtn" onclick="loadStrats()" style="padding: 12px 20px; width: auto; margin-left: auto;">Load Optimum Strategies</button>
                    <div class="status-message" id="stratStatus" style="display:none; margin-left:10px;"></div>
                </div>
                <div id="strategiesContainer" style="display:flex; flex-direction:column; gap:10px;"></div>
                <div class="legend" id="strategiesLegend" style="margin-top:12px; display:flex; gap:12px;">
                    <div class="legend-item">
                        <div class="legend-color" style="background-color:#FF0000;"></div>
                        <span>Soft</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background-color:#FFFF00; border:1px solid #ddd;"></div>
                        <span>Medium</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background-color:#888888;"></div>
                        <span>Hard</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background-color:rgba(144,238,144,0.8); border:1px solid rgba(0,100,0,0.2);"></div>
                        <span>Pit Window</span>
                    </div>
                </div>
            </div>
            <div class="card" style="grid-column: 1 / -1;">
                <h2>Qualifying Simulation</h2>
                <div style="margin-bottom: 15px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                    <button id="loadQualifyingBtn" onclick="loadQuali()" style="padding: 12px 20px; width: auto; margin-left: auto;">Load Qualifying Data</button>
                    <div class="status-message" id="qualiStatus" style="display:none; margin-left:10px;"></div>
                </div>
                <div class="chart-container">
                    <canvas id="qualifyingChart"></canvas>
                </div>
            </div>
            <div class="card" style="grid-column: 1 / -1;">
                <h2>Race Pace Simulation</h2>
                <div style="margin-bottom: 15px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                    <button id="loadRacePaceBtn" onclick="loadRacePace()" style="padding: 12px 20px; width: auto; margin-left: auto;">Load Race Pace Data</button>
                    <div class="status-message" id="racePaceStatus" style="display:none; margin-left:10px;"></div>
                </div>
                <div class="chart-container">
                    <canvas id="racePaceChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
