<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Simulation - Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #ebab3c 0%, #de2d19 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }
        .header h1 {
            font-size: 48px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        .card {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .card h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 24px;
        }
        .status-message {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .status-loading {
            background-color: #fff3cd;
            color: #856404;
        }
        .status-success {
            background-color: #d4edda;
            color: #155724;
        }
        .status-error {
            background-color: #f8d7da;
            color: #721c24;
        }
        button {
            background-color: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            width: 100%;
            font-weight: bold;
        }
        button:hover {
            background-color: #764ba2;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        .output {
            background-color: #1e1e1e;
            color: #00ff00;
            padding: 15px;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.5;
            max-height: 600px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            margin-top: 15px;
        }
        .output::-webkit-scrollbar {
            width: 8px;
        }
        .output::-webkit-scrollbar-track {
            background: #333;
            border-radius: 5px;
        }
        .output::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>F1 Simulation Dashboard</h1>
            <p>Powered by C# Backend with Python Integration</p>
        </div>

        <div class="cards">
            <!-- API Status Card -->
            <div class="card">
                <h2>API Status</h2>
                <div class="status-message status-loading" id="apiStatus">
                    Checking connection...
                </div>
            </div>

            <!-- C# Runner Card -->
            <div class="card">
                <h2>C# Application</h2>
                <button id="runButton" onclick="runCSharp()">Run C# Script</button>
                <div class="status-message" id="csharpStatus" style="display: none;"></div>
                <div class="output" id="output" style="display: none;"></div>
            </div>
        </div>
    </div>

    <script>
        // Check C# API status on page load
        window.addEventListener('load', function() {
            // Check C# API health
            fetch('http://localhost:5000/api/solver/health')
                .then(response => response.json())
                .then(data => {
                    const apiStatus = document.getElementById('apiStatus');
                    apiStatus.textContent = '✓ ' + data.service;
                    apiStatus.className = 'status-message status-success';
                })
                .catch(error => {
                    const apiStatus = document.getElementById('apiStatus');
                    apiStatus.textContent = '✗ Could not connect to C# API. Make sure to run: dotnet run';
                    apiStatus.className = 'status-message status-error';
                });
        });

        function runCSharp() {
            const button = document.getElementById('runButton');
            const status = document.getElementById('csharpStatus');
            const output = document.getElementById('output');

            // Disable button and show loading
            button.disabled = true;
            status.textContent = 'Running F1 Simulation Solver...';
            status.className = 'status-message status-loading';
            status.style.display = 'block';
            output.style.display = 'none';

            fetch('http://localhost:5000/api/solver/run-solver?country=Spain&year=2024')
                .then(response => response.json())
                .then(data => {
                    // Update status
                    if (data.success) {
                        status.textContent = 'Simulation completed successfully';
                        status.className = 'status-message status-success';
                    } else {
                        status.textContent = 'Simulation encountered errors';
                        status.className = 'status-message status-error';
                    }

                    // Display output
                    output.textContent = data.output || 'No output';
                    output.style.display = 'block';

                    // Re-enable button
                    button.disabled = false;
                })
                .catch(error => {
                    status.textContent = 'Error: ' + error;
                    status.className = 'status-message status-error';
                    output.textContent = 'Failed to connect to C# API. Make sure to run: dotnet run';
                    output.style.display = 'block';
                    button.disabled = false;
                });
        }
    </script>
</body>
</html>
